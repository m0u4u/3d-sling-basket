<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAINTENANCE - 3D SLING BASKET</title>
    <meta name="description" content="メンテナンスに関する情報をお伝えしています。">
    <meta name="generator" content="Gemini - Vibe Coding">
    <meta name="author" content="m0u4u & Gemini">

    <link rel="stylesheet" href="css/maintenance.css?ver=26.06.29">
    
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-512.png" sizes="512x512">
    <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
    <link rel="manifest" href="assets/favicon/manifest.json">
</head>
<body>
    <main class="maintenance-container">
        <h1>3D SLING BASKET</h1>
        
        <div class="icon-container">
            <canvas id="ballCanvas" width="512" height="512"></canvas>
            <button id="playPauseBtn" class="control-btn" title="アニメーションを一時停止する" aria-label="アニメーションを一時停止する">
                <svg class="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <svg class="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
        </div>

        <div class="status-badge emergency" role="status"></div>
        
        <div class="info-panel">
            <div class="info-row">
                <span class="info-label">SCHEDULE</span>
                <div class="info-content">
                    <strong class="info-value">毎週水曜日 0:00 ～ 23:59（日本時間）</strong>
                </div>
            </div>
            <div class="info-row">
                <span class="info-label">NOTICE</span>
                <div class="info-content">
                    <span class="info-value">上記の時間帯は定期メンテナンスです。<br class="sp-only">ゲームのご利用中にメンテナンスが始まった場合でも、ページを再読み込みするまでは遊べます。</span>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2026 m0u4u.
        </footer>
    </main>

    <script>
        (function () {
            'use strict';

            const canvas = document.getElementById('ballCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d', { alpha: true });
            const btn = document.getElementById('playPauseBtn');
            const container = canvas.parentElement;
            
            const centerX = 256;
            const centerY = 256;
            const br = 230; 
            const rotationAngle = 0.2; 

            function drawBall() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(rotationAngle);

                const grad = ctx.createRadialGradient(-br * 0.3, -br * 0.3, br * 0.1, 0, 0, br);
                grad.addColorStop(0, '#e67e22');   
                grad.addColorStop(0.8, '#d35400'); 
                grad.addColorStop(1, '#a04000');   
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, br, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(15, 15, 15, 0.85)';
                ctx.lineWidth = Math.max(4, br * 0.09);
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                ctx.moveTo(-br, 0); ctx.lineTo(br, 0);
                ctx.moveTo(0, -br); ctx.lineTo(0, br);
                ctx.stroke();
                
                ctx.beginPath(); 
                ctx.arc(-br * 1.1, 0, br * 0.85, -Math.PI/3, Math.PI/3); ctx.stroke();
                ctx.beginPath(); 
                ctx.arc(br * 1.1, 0, br * 0.85, Math.PI * 2/3, Math.PI * 4/3); ctx.stroke();
                
                ctx.restore();
            }

            drawBall();

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (prefersReducedMotion && btn && container) {
                container.classList.add('is-paused');
                btn.classList.add('is-paused');
                btn.dataset.manualPaused = 'true';
                btn.setAttribute('title', 'アニメーションを再生する');
                btn.setAttribute('aria-label', 'アニメーションを再生する');
            }

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (container) container.classList.add('is-paused');
                    if (btn) btn.classList.add('is-paused');
                } else {
                    if (btn && !btn.dataset.manualPaused) {
                        if (container) container.classList.remove('is-paused');
                        btn.classList.remove('is-paused');
                    }
                }
            }, false);

            if (btn && container) {
                btn.addEventListener('click', function () {
                    const isPaused = container.classList.toggle('is-paused');
                    btn.classList.toggle('is-paused', isPaused);
                    
                    if (isPaused) {
                        btn.dataset.manualPaused = 'true';
                        btn.setAttribute('title', 'アニメーションを再生する');
                        btn.setAttribute('aria-label', 'アニメーションを再生する');
                    } else {
                        delete btn.dataset.manualPaused;
                        btn.setAttribute('title', 'アニメーションを一時停止する');
                        btn.setAttribute('aria-label', 'アニメーションを一時停止する');
                    }
                });
            }
        })();
    </script>
</body>
</html>
